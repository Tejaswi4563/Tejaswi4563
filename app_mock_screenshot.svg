<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#22364a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#2d4053"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <text x="60" y="50" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">AI Background &amp; Music Remover</text>

  <!-- Status card -->
  <rect x="50" y="90" width="1180" height="120" rx="14" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="80" y="122" font-family="Arial, sans-serif" font-size="18" fill="#ffeaa7" font-weight="600">Available modules:</text>
  <text x="80" y="152" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">✅ AI Background Removal</text>
  <text x="80" y="178" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">✅ Audio Processing</text>
  <text x="80" y="204" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">✅ Basic Image Processing</text>

  <!-- Main panel -->
  <rect x="50" y="220" width="1180" height="540" rx="14" fill="url(#panel)" filter="url(#shadow)"/>

  <!-- Tabs -->
  <rect x="80" y="246" width="360" height="42" rx="10" fill="#48607d"/>
  <rect x="455" y="246" width="330" height="42" rx="10" fill="#48607d"/>
  <text x="110" y="274" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Image Background Removal</text>
  <text x="490" y="274" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Audio Noise Removal</text>

  <!-- Buttons -->
  <g>
    <rect x="90" y="316" width="150" height="38" rx="8" fill="#3498db"/>
    <text x="135" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Upload Image</text>

    <rect x="260" y="316" width="190" height="38" rx="8" fill="#e74c3c"/>
    <text x="355" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">AI Remove Background</text>

    <rect x="470" y="316" width="210" height="38" rx="8" fill="#9b59b6"/>
    <text x="575" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Basic Remove Background</text>

    <rect x="700" y="316" width="180" height="38" rx="8" fill="#f39c12"/>
    <text x="790" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Replace Background</text>

    <rect x="900" y="316" width="150" height="38" rx="8" fill="#27ae60"/>
    <text x="975" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Save Image</text>
  </g>

  <!-- Preview panels -->
  <rect x="90" y="380" width="500" height="320" rx="12" fill="#2a3b4f"/>
  <rect x="670" y="380" width="500" height="320" rx="12" fill="#2a3b4f"/>

  <text x="280" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Original Image</text>
  <text x="920" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Processed Image</text>

  <!-- Original image mock -->
  <circle cx="255" cy="500" r="80" fill="#f4c28a"/>
  <rect x="200" y="565" width="110" height="100" rx="18" fill="#3c82d8"/>
  <rect x="165" y="455" width="40" height="70" rx="12" fill="#405a7a"/>
  <rect x="290" y="455" width="40" height="70" rx="12" fill="#405a7a"/>
  <ellipse cx="220" cy="495" rx="18" ry="20" fill="#1d2a36"/>
  <ellipse cx="290" cy="495" rx="18" ry="20" fill="#1d2a36"/>
  <path d="M205 540 Q255 515 305 540" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M155 520 L105 430" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.35"/>
  <path d="M350 520 L420 440" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.35"/>

  <!-- Processed image mock -->
  <circle cx="920" cy="500" r="80" fill="#f4c28a"/>
  <rect x="865" y="565" width="110" height="100" rx="18" fill="#3c82d8"/>
  <rect x="830" y="455" width="40" height="70" rx="12" fill="#405a7a"/>
  <rect x="955" y="455" width="40" height="70" rx="12" fill="#405a7a"/>
  <ellipse cx="885" cy="495" rx="18" ry="20" fill="#1d2a36"/>
  <ellipse cx="955" cy="495" rx="18" ry="20" fill="#1d2a36"/>
  <path d="M870 540 Q920 515 970 540" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Transparent background background effect -->
  <rect x="730" y="420" width="320" height="140" fill="none" stroke="#dfe6e9" stroke-dasharray="8 8" stroke-width="2" opacity="0.9"/>

  <!-- Bottom status -->
  <rect x="90" y="708" width="1060" height="34" rx="8" fill="#2a3b4f"/>
  <text x="118" y="731" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">Status: Background removal ready to use</text>
</svg>
